# Construction iOS sur machine distante.
#
# Pourquoi : le Mac de développement est un MacBook Pro 2017, bloqué sur macOS 13 Ventura,
# donc sur Xcode 15.2 et le SDK iOS 17.2. Apple impose un SDK minimum qui monte chaque année
# pour accepter une soumission, et un framework binaire récent — Capacitor 8 — n'est pas
# entièrement lisible par un compilateur Swift de 2024. Les deux problèmes disparaissent sur
# un runner macOS à jour, sans changer de machine.
#
# Deux travaux séparés à dessein. « build » ne demande aucun secret et tourne à chaque
# poussée : il dit si le code iOS compile. « release » signe, archive et téléverse vers
# TestFlight ; il se déclenche à la main, parce qu'envoyer une version à Apple n'est pas
# quelque chose qui doit arriver tout seul au détour d'un commit.
name: iOS

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      publier:
        description: "Signer, archiver et téléverser vers TestFlight"
        type: boolean
        default: false

jobs:
  build:
    name: Compilation iOS (non signée)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Utiliser le Xcode le plus récent
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Tracé dans le journal : c'est l'information qu'on vient chercher ici, et elle
      # permet de comparer avec la machine de développement quand une erreur ne se
      # reproduit que d'un côté.
      - name: Versions de la chaîne
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i iphoneos || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Dépendances
        working-directory: mobile
        run: npm ci

      - name: Construire l'application web
        working-directory: mobile
        run: npm run build

      - name: Synchroniser Capacitor
        working-directory: mobile
        run: npx cap sync ios

      # Sans signature : on vérifie que le code compile, pas qu'il est distribuable. La
      # signature demande des secrets, et ce travail doit rester utile sur une
      # contribution extérieure qui n'y a pas accès.
      - name: Compiler
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: Archive signée et envoi TestFlight
    runs-on: macos-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publier
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Dépendances et construction web
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync ios

      # La clé d'API App Store Connect remplace le couple certificat + profil : Xcode crée
      # et renouvelle lui-même ce qu'il faut. Un secret au lieu de quatre, et rien à
      # réexporter quand un certificat expire.
      - name: Déposer la clé App Store Connect
        env:
          CLE: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CLE_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          # Élagage défensif : un retour à la ligne collé par mégarde dans un secret se
          # retrouve dans le « kid » du jeton, et Apple répond 401 sans dire pourquoi.
          CLE_ID="$(printf '%s' "$CLE_ID" | tr -d '[:space:]')"
          echo "ASC_KEY_ID=$CLE_ID" >> "$GITHUB_ENV"
          printf '%s' "$CLE" > ~/private_keys/AuthKey_${CLE_ID}.p8

      # Un 401 d'Apple pendant l'archivage ne dit pas si la clé est mal formée, mal
      # recopiée ou simplement pas assez habilitée. Ce contrôle pose la question
      # directement à l'API et ne rapporte que le code de réponse — jamais la clé.
      - name: Contrôler la clé App Store Connect
        env:
          CLE_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EMETTEUR: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          CLE_ID="$(printf '%s' "$CLE_ID" | tr -d '[:space:]')"
          EMETTEUR="$(printf '%s' "$EMETTEUR" | tr -d '[:space:]')"
          CHEMIN=~/private_keys/AuthKey_${CLE_ID}.p8

          # Longueur et forme seulement : de quoi repérer un blanc parasite ou une valeur
          # recopiée depuis la mauvaise colonne, sans rien divulguer.
          echo "Forme des identifiants :"
          printf '  Key ID    : %s caractères, attendu 10 — conforme : %s\n' \
            "${#CLE_ID}" "$(printf '%s' "$CLE_ID" | grep -qE '^[A-Z0-9]{10}$' && echo oui || echo NON)"
          printf '  Issuer ID : %s caractères, attendu 36 — conforme : %s\n' \
            "${#EMETTEUR}" "$(printf '%s' "$EMETTEUR" | grep -qE '^[0-9a-f-]{36}$' && echo oui || echo NON)"

          # Empreintes plutôt que valeurs : le dépôt est public, et ces lignes finissent
          # dans un journal lisible par tous. Comparées aux empreintes relevées sur la
          # console Apple, elles disent si le bon identifiant a été recopié.
          printf '  empreinte Key ID    : %s\n' "$(printf '%s' "$CLE_ID" | shasum -a 256 | cut -c1-16)"
          printf '  empreinte Issuer ID : %s\n' "$(printf '%s' "$EMETTEUR" | shasum -a 256 | cut -c1-16)"

          echo "Forme de la clé :"
          head -c 27 "$CHEMIN" | grep -q "BEGIN PRIVATE KEY" \
            && echo "  en-tête PEM présent" \
            || echo "  ATTENTION : en-tête PEM absent — la clé a-t-elle été recopiée en entier ?"
          openssl pkey -in "$CHEMIN" -noout 2>/dev/null \
            && echo "  clé privée lisible par OpenSSL" \
            || echo "  ATTENTION : OpenSSL ne lit pas cette clé"
          # Empreinte de la clé publique dérivée. Le .p8 ne contient pas son Key ID : rien
          # n'empêche d'y coller une autre clé — celle d'APNs, par exemple, qui est aussi un
          # .p8 valide qu'OpenSSL lit sans broncher. L'empreinte permet de vérifier de
          # l'extérieur quelle clé a réellement été déposée, sans la divulguer.
          echo "  empreinte publique : $(openssl pkey -in "$CHEMIN" -pubout -outform DER 2>/dev/null | openssl dgst -sha256 | awk '{print $2}' | cut -c1-32)"

          # Environnement isolé : le Python du runner est « externally managed » et
          # refuse toute installation globale (PEP 668).
          python3 -m venv /tmp/venv-asc
          /tmp/venv-asc/bin/pip install --quiet cryptography
          /tmp/venv-asc/bin/python - <<'PY' > /tmp/jeton.txt
          import os, time, json, base64
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils

          cle_id = os.environ["CLE_ID"].strip()
          emetteur = os.environ["EMETTEUR"].strip()
          chemin = os.path.expanduser(f"~/private_keys/AuthKey_{cle_id}.p8")
          b64 = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=").decode()

          entete = b64(json.dumps({"alg": "ES256", "kid": cle_id, "typ": "JWT"}).encode())
          charge = b64(json.dumps({
              "iss": emetteur, "iat": int(time.time()), "exp": int(time.time()) + 600,
              "aud": "appstoreconnect-v1"}).encode())
          message = f"{entete}.{charge}".encode()

          cle = serialization.load_pem_private_key(open(chemin, "rb").read(), password=None)
          # decode_dss_signature plutôt qu'un découpage DER à la main : ES256 attend R||S
          # sur 32 octets chacun, et une conversion approximative produit un jeton que
          # seul Apple peut rejeter — on ne saurait plus si la clé ou le code est en cause.
          r, s = utils.decode_dss_signature(cle.sign(message, ec.ECDSA(hashes.SHA256())))
          signature = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          print(f"{entete}.{charge}.{b64(signature)}")
          PY

          CODE=$(curl -s -o /tmp/reponse.json -w "%{http_code}" \
            -H "Authorization: Bearer $(cat /tmp/jeton.txt)" \
            "https://api.appstoreconnect.apple.com/v1/apps?limit=1")
          echo "Réponse d'Apple : HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "  clé acceptée. Fiches d'application visibles :"
            python3 -c "import json;d=json.load(open('/tmp/reponse.json'));print('   ', len(d.get('data',[])), 'application(s)'); [print('    -', a['attributes'].get('bundleId')) for a in d.get('data',[])]"
            # Arrêt immédiat plutôt que huit minutes d'archivage pour échouer à l'export :
            # sans fiche d'application, Apple n'émet aucun profil de distribution pour ce
            # bundle, et le message d'Xcode à ce moment-là ne désigne pas la cause.
            if ! grep -q "com.schoolsaas.mobile" /tmp/reponse.json; then
              echo "  ARRÊT : aucune fiche d'application pour com.schoolsaas.mobile."
              echo "    Créez-la dans App Store Connect > Apps > +, avec ce bundle ID exact."
              echo "    Sans elle, Apple refuse d'émettre un profil de distribution."
              exit 1
            fi
          else
            echo "  clé REFUSÉE. Causes habituelles, par fréquence :"
            echo "   1. rôle insuffisant — il faut « Admin » ou « App Manager », pas « Developer »"
            echo "   2. Issuer ID recopié depuis la mauvaise ligne de la page des clés"
            echo "   3. contenu du .p8 tronqué dans le secret GitHub"
            python3 -c "import json;d=json.load(open('/tmp/reponse.json'));[print('   détail Apple :', e.get('title'), '-', e.get('detail')) for e in d.get('errors',[])]" 2>/dev/null || true
            exit 1
          fi

      - name: Archiver
        working-directory: mobile/ios/App
        env:
          CLE_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EMETTEUR: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$EMETTEUR" \
            archive

      - name: Options d'export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <!-- « app-store » et non « app-store-connect » : le second est refusé par xcodebuild. -->
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>253HSP874T</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Exporter l'IPA
        env:
          CLE_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EMETTEUR: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$EMETTEUR"

      # Conservée même en cas d'échec de l'envoi : si Apple refuse, on veut pouvoir
      # récupérer l'IPA et la soumettre à la main avec Transporter.
      - name: Conserver l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Téléverser vers TestFlight
        env:
          CLE_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EMETTEUR: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$CLE_ID" \
            --apiIssuer "$EMETTEUR"
