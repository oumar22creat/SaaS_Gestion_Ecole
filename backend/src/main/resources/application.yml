spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/school_saas}
    username: ${DB_USER:school_saas}
    password: ${DB_PASSWORD:school_saas}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
