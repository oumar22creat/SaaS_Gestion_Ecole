spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Rôle applicatif restreint (non superutilisateur) — voir backend/docker/postgres-init/
    # 01-create-app-role.sh. Nécessaire pour que les politiques Row-Level Security
    # s'appliquent réellement (docs/ARCHITECTURE.md ADR-001) : elles sont toujours
    # contournées pour un superutilisateur PostgreSQL, sans exception.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/school_saas}
    username: ${DB_USER:school_saas}
    password: ${DB_PASSWORD:school_saas}
  flyway:
    # Rôle superutilisateur séparé, utilisé UNIQUEMENT pour les migrations (DDL) — jamais par
    # l'application au runtime.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/school_saas}
    user: ${DB_ADMIN_USER:school_saas_admin}
    password: ${DB_ADMIN_PASSWORD:school_saas_admin}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Garde la même connexion JDBC physique pour toute la durée de la requête (pas
        # seulement pour chaque transaction) : nécessaire pour que la variable de session
        # PostgreSQL app.tenant_id (utilisée par les politiques RLS, voir
        # docs/ARCHITECTURE.md ADR-001) reste fiable même quand plusieurs transactions
        # @Transactional distinctes s'exécutent dans une même requête (Open Session In View).
        connection.handling_mode: DELAYED_ACQUISITION_AND_HOLD

app:
  mobile-money:
    # Vide par défaut : le callback échoue fermé tant que l'opérateur n'est pas branché.
    callback-secret: ${MOBILE_MONEY_CALLBACK_SECRET:}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-min-32-bytes}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    # Origines autorisées à appeler l'API depuis un navigateur. Utile seulement en dev/
    # staging (Web sur une origine différente du backend, ex. `ng serve` sur :4200) — en
    # production, Nginx sert Web+API sur le même domaine, voir README.md "Environnements".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  billing:
    # Cycle de vie de l'abonnement (cahier-des-charges.md §4.2) — valeurs par défaut à
    # confirmer avec le porteur de projet, voir docs/ARCHITECTURE.md ADR-009.
    trial-days: ${BILLING_TRIAL_DAYS:30}
    default-trial-plan-code: ${BILLING_DEFAULT_TRIAL_PLAN_CODE:ESSENTIEL}
    past-due-grace-days: ${BILLING_PAST_DUE_GRACE_DAYS:3}
    read-only-grace-days: ${BILLING_READ_ONLY_GRACE_DAYS:7}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    checkout-success-url: ${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:4200/billing/success}
    checkout-cancel-url: ${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:4200/billing/cancel}
  storage:
    # Stockage local (dev/MVP) — voir docs/ARCHITECTURE.md ADR-017. S3 réel non câblé (pas de
    # credentials) : brancher un StorageGateway S3 reste un remplacement d'implémentation.
    local-path: ${STORAGE_LOCAL_PATH:./storage}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
