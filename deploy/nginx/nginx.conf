user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $host [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Les bulletins et les exports PDF peuvent être volumineux ; les téléversements de logos
    # sont plafonnés côté applicatif à 2 Mo (TenantLogoService), on garde une marge ici.
    client_max_body_size 8m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml+rss text/xml image/svg+xml application/wasm;

    # Limitation de débit sur l'authentification, en complément de celle du backend : elle
    # protège aussi les tentatives qui n'atteignent jamais l'application.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
