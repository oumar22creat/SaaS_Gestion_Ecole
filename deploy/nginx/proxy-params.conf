proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# IMPORTANT — sécurité multi-tenant.
# TenantResolver accepte un en-tête X-Tenant-Id pour désigner l'établissement. C'est une
# commodité de test : sur les requêtes authentifiées le JWT a déjà fixé le tenant et l'en-tête
# est ignoré, mais sur un appel anonyme il serait cru sur parole. On l'efface donc à l'entrée :
# aucun client ne doit pouvoir choisir son établissement depuis l'extérieur.
proxy_set_header X-Tenant-Id "";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
