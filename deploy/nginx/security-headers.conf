# En-têtes de sécurité.
#
# Fichier séparé et inclus dans CHAQUE location qui définit ses propres `add_header` : nginx
# n'hérite pas les add_header d'un bloc parent dès que le bloc enfant en déclare un seul.
# Un `add_header Cache-Control` dans une location suffit donc à faire disparaître HSTS et le
# reste, silencieusement. Piège constaté en production : les quatre en-têtes manquaient.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
