# En-têtes propres au site vitrine (domaine nu), en plus de security-headers.conf.
#
# Même règle que security-headers.conf : nginx n'hérite pas les add_header du bloc parent dès
# qu'une location en déclare un. Toute location du site qui pose son propre add_header doit
# donc inclure CE fichier ET security-headers.conf.
#
# CSP stricte : le site n'a aucun script ni style inline, aucune ressource tierce (polices,
# icônes et images auto-hébergées). Le seul bloc <script type="application/ld+json"> de
# l'accueil est un bloc de données, jamais exécuté : script-src ne s'y applique pas.
# Les liens externes (wa.me, apps.apple.com…) sont des navigations, hors du champ de la CSP.
# Toute nouvelle ressource externe ou tout attribut style="" sera bloqué : c'est voulu.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
