apply plugin: 'com.android.application'

/*
 * Identifiants de signature, lus hors du dépôt.
 *
 * Google Play signe lui-même l'application distribuée ; ce qu'on fournit ici n'est que la
 * « clé de téléversement », celle qui prouve à Play que la livraison vient bien de nous. Elle
 * se remplace en cas de perte, contrairement à la clé de signature — raison pour laquelle on
 * accepte Play App Signing.
 *
 * Le fichier keystore.properties n'est pas versionné (voir .gitignore). Sans lui, la
 * compilation de release reste possible mais non signée : utile en intégration continue, où
 * personne n'a à détenir la clé.
 */
def proprietesSignature = new Properties()
def fichierSignature = rootProject.file('keystore.properties')
if (fichierSignature.exists()) {
    fichierSignature.withInputStream { proprietesSignature.load(it) }
}

android {
    /*
     * namespace et applicationId sont volontairement différents.
     *
     * - applicationId est l'identité publique : celle que Google Play et Firebase connaissent,
     *   et celle que renvoie getPackageName() à l'exécution. « com.schoolsaas.mobile » était
     *   déjà pris sur Google Play, d'où « tech.schoolmanager.app ».
     * - namespace ne sert qu'à la compilation : il fixe le paquet de la classe R générée et
     *   résout le « .MainActivity » du manifeste. Il reste aligné sur le paquet Java de
     *   MainActivity (com.schoolsaas.mobile), ce qui évite de déplacer le code source.
     *
     * Android autorise cet écart. Ce qui dépend de l'identité publique passe par
     * ${applicationId} (autorité du FileProvider dans le manifeste) ou par getPackageName()
     * côté Capacitor : rien n'est à renommer à la main.
     *
     * iOS n'est pas concerné : l'application publiée sur l'App Store garde son bundle
     * com.schoolsaas.mobile (projet Xcode), tout comme appId dans capacitor.config.ts.
     */
    namespace = "com.schoolsaas.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tech.schoolmanager.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (proprietesSignature.containsKey('storeFile')) {
                storeFile rootProject.file(proprietesSignature['storeFile'])
                storePassword proprietesSignature['storePassword']
                keyAlias proprietesSignature['keyAlias']
                keyPassword proprietesSignature['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Signée seulement si la clé est présente : sinon Gradle produirait un artefact
            // signé avec la clé de débogage, que Play refuse sans expliquer pourquoi.
            signingConfig proprietesSignature.containsKey('storeFile') ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
