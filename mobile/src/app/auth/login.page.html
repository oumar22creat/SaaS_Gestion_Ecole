<ion-content class="ion-padding">
  <section class="login-hero">
    <p class="login-hero-icon" aria-hidden="true"><ion-icon name="school-outline"></ion-icon></p>
    <h1 class="login-hero-title">Connexion</h1>
    <p class="login-hero-lede">Espace enseignants et personnel de l'établissement.</p>
  </section>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-item class="card-item">
      <ion-input
        label="Sous-domaine"
        labelPlacement="floating"
        placeholder="mon-ecole"
        formControlName="subdomain"
      />
    </ion-item>

    <ion-item class="card-item">
      <ion-input label="E-mail" labelPlacement="floating" type="email" formControlName="email" />
    </ion-item>

    <ion-item class="card-item">
      <ion-input
        label="Mot de passe"
        labelPlacement="floating"
        type="password"
        formControlName="password"
      />
    </ion-item>

    @if (errorMessage()) {
      <p class="flash-error">{{ errorMessage() }}</p>
    }

    <ion-button expand="block" type="submit" [disabled]="submitting()" class="ion-margin-top">
      @if (submitting()) {
        <ion-spinner name="dots" />
      } @else {
        <ion-icon aria-hidden="true" name="log-in-outline"></ion-icon> Se connecter
      }
    </ion-button>
  </form>
</ion-content>
