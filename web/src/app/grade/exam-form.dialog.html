<h2 mat-dialog-title>Ajouter une évaluation</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Classe</mat-label>
      <mat-select formControlName="schoolClassId">
        @for (schoolClass of classes(); track schoolClass.id) {
          <mat-option [value]="schoolClass.id">{{ schoolClass.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Matière</mat-label>
      <mat-select formControlName="subjectId">
        @for (subject of subjects(); track subject.id) {
          <mat-option [value]="subject.id">{{ subject.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Intitulé</mat-label>
      <input matInput formControlName="label" placeholder="Contrôle du 12/09" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Barème</mat-label>
      <input matInput type="number" min="1" formControlName="maxScore" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Coefficient</mat-label>
      <input matInput type="number" min="1" formControlName="coefficient" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="examDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Enregistrer
      }
    </button>
  </mat-dialog-actions>
</form>
