<div class="page-header">
  <h1>Évaluations</h1>
  <button mat-flat-button (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Ajouter une évaluation
  </button>
</div>

<table mat-table [dataSource]="exams()" class="data-table">
  <ng-container matColumnDef="examDate">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let exam">{{ exam.examDate }}</td>
  </ng-container>

  <ng-container matColumnDef="label">
    <th mat-header-cell *matHeaderCellDef>Intitulé</th>
    <td mat-cell *matCellDef="let exam">{{ exam.label }}</td>
  </ng-container>

  <ng-container matColumnDef="schoolClassId">
    <th mat-header-cell *matHeaderCellDef>Classe</th>
    <td mat-cell *matCellDef="let exam">{{ className(exam.schoolClassId) }}</td>
  </ng-container>

  <ng-container matColumnDef="subjectId">
    <th mat-header-cell *matHeaderCellDef>Matière</th>
    <td mat-cell *matCellDef="let exam">{{ subjectName(exam.subjectId) }}</td>
  </ng-container>

  <ng-container matColumnDef="coefficient">
    <th mat-header-cell *matHeaderCellDef>Coefficient</th>
    <td mat-cell *matCellDef="let exam">{{ exam.coefficient }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let exam">
      <a mat-icon-button [routerLink]="['/exams', exam.id, 'grades']" aria-label="Saisir les notes">
        <mat-icon>edit_note</mat-icon>
      </a>
      <button mat-icon-button (click)="remove(exam)" aria-label="Supprimer">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (!loading() && exams().length === 0) {
  <p class="empty-state">Aucune évaluation pour l'instant.</p>
}
