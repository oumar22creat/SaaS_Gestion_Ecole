<h2 mat-dialog-title>{{ data.parent ? 'Modifier le parent' : 'Ajouter un parent' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Prénom</mat-label>
      <input matInput formControlName="firstName" />
      <mat-error>{{ fieldError(form.controls.firstName) }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="lastName" />
      <mat-error>{{ fieldError(form.controls.lastName) }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error>{{ fieldError(form.controls.email) }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Téléphone</mat-label>
      <input matInput formControlName="phone" />
      <mat-error>{{ fieldError(form.controls.phone) }}</mat-error>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Enregistrer
      }
    </button>
  </mat-dialog-actions>
</form>
