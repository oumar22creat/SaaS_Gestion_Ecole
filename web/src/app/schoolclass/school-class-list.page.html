<div class="page-header">
  <h1>Classes</h1>
  <button mat-flat-button (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Ajouter une classe
  </button>
</div>

<table mat-table [dataSource]="classes()" class="data-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let schoolClass">{{ schoolClass.name }}</td>
  </ng-container>

  <ng-container matColumnDef="headTeacherId">
    <th mat-header-cell *matHeaderCellDef>Professeur principal</th>
    <td mat-cell *matCellDef="let schoolClass">{{ schoolClass.headTeacherId ?? '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let schoolClass">
      <a mat-icon-button [routerLink]="['/classes', schoolClass.id, 'subjects']" aria-label="Matières">
        <mat-icon>menu_book</mat-icon>
      </a>
      <button mat-icon-button (click)="openEditDialog(schoolClass)" aria-label="Modifier">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="remove(schoolClass)" aria-label="Supprimer">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (!loading() && classes().length === 0) {
  <p class="empty-state">Aucune classe pour l'instant.</p>
}
