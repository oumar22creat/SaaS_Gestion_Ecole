<mat-sidenav-container class="shell" [hasBackdrop]="isCompact()">
  <mat-sidenav
    #nav
    class="shell-nav"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="!isCompact()"
  >
    <div class="nav-user">
      <span class="nav-avatar" aria-hidden="true">{{ initials }}</span>
      <span class="nav-user-text">
        <span class="nav-user-name">{{ email ?? 'Compte' }}</span>
        <span class="nav-user-role">{{ roleLabel }}</span>
      </span>
    </div>

    @for (section of navSections; track section.title) {
      <p class="nav-section">{{ section.title }}</p>
      <mat-nav-list>
        @for (link of section.links; track link.path) {
          <a
            mat-list-item
            [routerLink]="link.path"
            routerLinkActive="active-link"
            (click)="closeOnCompact(nav)"
          >
            <mat-icon class="nav-icon" aria-hidden="true">{{ link.icon }}</mat-icon>
            {{ link.label }}
          </a>
        }
      </mat-nav-list>
    }

    <div class="nav-footer">
      <button mat-stroked-button class="logout-button" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        Déconnexion
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (isCompact()) {
      <div class="content-bar">
        <button mat-icon-button (click)="nav.toggle()" aria-label="Ouvrir la navigation">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="content-bar-role">{{ roleLabel }}</span>
      </div>
    }
    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
