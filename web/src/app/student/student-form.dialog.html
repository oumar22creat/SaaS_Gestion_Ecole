<h2 mat-dialog-title>{{ data.student ? "Modifier l'élève" : 'Ajouter un élève' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Matricule</mat-label>
      <input matInput formControlName="studentNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Prénom</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date de naissance</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="birthDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sexe</mat-label>
      <input matInput formControlName="gender" placeholder="F / M" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Classe</mat-label>
      <mat-select formControlName="schoolClassId">
        <mat-option [value]="null">Aucune</mat-option>
        @for (schoolClass of classes(); track schoolClass.id) {
          <mat-option [value]="schoolClass.id">{{ schoolClass.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Enregistrer
      }
    </button>
  </mat-dialog-actions>
</form>
