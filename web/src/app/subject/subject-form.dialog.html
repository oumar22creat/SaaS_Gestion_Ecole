<h2 mat-dialog-title>{{ data.subject ? 'Modifier la matière' : 'Ajouter une matière' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" />
      <mat-error>{{ fieldError(form.controls.name) }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" />
      <mat-error>{{ fieldError(form.controls.code) }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Coefficient</mat-label>
      <input matInput type="number" min="1" formControlName="coefficient" />
      <mat-error>{{ fieldError(form.controls.coefficient) }}</mat-error>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Enregistrer
      }
    </button>
  </mat-dialog-actions>
</form>
