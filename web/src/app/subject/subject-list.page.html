<div class="page-header">
  <h1>Matières</h1>
  <button mat-flat-button (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Ajouter une matière
  </button>
</div>

<table mat-table [dataSource]="subjects()" class="data-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let subject">{{ subject.name }}</td>
  </ng-container>

  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef>Code</th>
    <td mat-cell *matCellDef="let subject">{{ subject.code }}</td>
  </ng-container>

  <ng-container matColumnDef="coefficient">
    <th mat-header-cell *matHeaderCellDef>Coefficient</th>
    <td mat-cell *matCellDef="let subject">{{ subject.coefficient }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let subject">
      <button mat-icon-button (click)="openEditDialog(subject)" aria-label="Modifier">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="remove(subject)" aria-label="Supprimer">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (!loading() && subjects().length === 0) {
  <p class="empty-state">Aucune matière pour l'instant.</p>
}
