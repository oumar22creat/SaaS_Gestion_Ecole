<div class="page-header">
  <h1>Enseignants</h1>
  <button mat-flat-button (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Ajouter un enseignant
  </button>
</div>

<table mat-table [dataSource]="teachers()" class="data-table">
  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef>Prénom</th>
    <td mat-cell *matCellDef="let teacher">{{ teacher.firstName }}</td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let teacher">{{ teacher.lastName }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>E-mail</th>
    <td mat-cell *matCellDef="let teacher">{{ teacher.email || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Téléphone</th>
    <td mat-cell *matCellDef="let teacher">{{ teacher.phone || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Statut</th>
    <td mat-cell *matCellDef="let teacher">
      <mat-chip [class.inactive-chip]="!teacher.active">{{ teacher.active ? 'Actif' : 'Inactif' }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let teacher">
      <button mat-icon-button (click)="openEditDialog(teacher)" aria-label="Modifier">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="deactivate(teacher)" aria-label="Désactiver" [disabled]="!teacher.active">
        <mat-icon>block</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (!loading() && teachers().length === 0) {
  <p class="empty-state">Aucun enseignant pour l'instant.</p>
}
